name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Erlaubt einen Deploy von Hand, ohne Commit.
  workflow_dispatch:

# Nur ein Deploy zur Zeit; laufende nicht abbrechen, damit eine Seite nicht
# halb veroeffentlicht liegen bleibt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Playwright-Browser holen
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Testbericht bei Fehlschlag mitnehmen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    # Veroeffentlicht wird nur, was gruen ist.
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
